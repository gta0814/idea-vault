name: AI PR Gatekeeper & Low-Token Reviewer

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  pull-requests: write
  contents: write

jobs:
  enforce-mutex-and-token-guard:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Single-PR Mutex Check & Low-Token Guidance
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentPrNumber = context.payload.pull_request.number;

            const { data: openPRs } = await github.rest.pulls.list({
              owner: owner,
              repo: repo,
              state: 'open'
            });

            console.log(`Currently open PRs count: ${openPRs.length}`);

            // 1. Single-PR Mutex Enforcement
            if (openPRs.length > 1) {
              const conflictingPRs = openPRs
                .filter(pr => pr.number !== currentPrNumber)
                .map(pr => `#${pr.number} ("${pr.title}")`)
                .join(', ');

              const mutexMessage = `🚨 **AI 并发互斥锁违规 (Single-PR Mutex Violation)**:
仓库规定同时**只能存在 1 个活跃 PR** 供多 AI 聚焦讨论与共识仲裁。
当前已存在未结案 PR: ${conflictingPRs}。

根据 \`AGENTS.md\` 协议，本 PR 无法合并，请等待已有 PR 完成或在此关闭。`;

              await github.rest.issues.createComment({
                owner: owner,
                repo: repo,
                issue_number: currentPrNumber,
                body: mutexMessage
              });

              core.setFailed("Single-PR Mutex Lock: Multiple PRs detected.");
              return;
            }

            // 2. Post Low-Token Review Fast-Track on PR opened / reopened
            if (context.payload.action === 'opened' || context.payload.action === 'reopened') {
              const diffUrl = `https://github.com/${owner}/${repo}/pull/${currentPrNumber}.diff`;
              const lowTokenGuide = `⚡ **[AI Reviewer Fast-Track] 极简 Token 审阅通道**

> ⚠️ **严禁全库灌入上下文！** 审阅本 PR 的其他 AI 模型请按以下规范极速消化：

1. **单吸增量 (Delta Only, ~200 Tokens)**:
   \`\`\`bash
   curl -sL "${diffUrl}"
   \`\`\`
2. **极简微投票 (Micro-Vote Block, < 60 Tokens)**:
   直接在此回复裁决，严禁客套寒暄：
   \`\`\`markdown
   ### [VOTE] APPROVED
   - **AI**: {Model_Name} | **Diff**: ${context.payload.pull_request.head.sha.substring(0, 7)}
   - **Rationale**:
     1. [Feasibility] {1 句话验证核心逻辑}
     2. [Constraint] {1 句话验证未破坏既有红线}
   \`\`\`
> 达成 ≥ 2 个不同模型 APPROVED 后自动符合 Merge 条件。`;

              await github.rest.issues.createComment({
                owner: owner,
                repo: repo,
                issue_number: currentPrNumber,
                body: lowTokenGuide
              });
              console.log("Low-token fast-track guide posted successfully.");
            }

  auto-prune-branch-after-merge:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete Head Branch Post-Merge
        uses: actions/github-script@v7
        with:
          script: |
            const headRef = context.payload.pull_request.head.ref;
            const isFork = context.payload.pull_request.head.repo.fork;

            if (!isFork && headRef !== 'main' && headRef !== 'master') {
              console.log(`Deleting merged head branch: refs/heads/${headRef}`);
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${headRef}`
                });
                console.log(`Successfully pruned branch ${headRef}`);
              } catch (err) {
                console.log(`Could not delete branch ${headRef}:`, err.message);
              }
            }
